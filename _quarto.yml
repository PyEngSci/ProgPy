format:
  html:
    toc-expand: false
    number-sections: true
    number-offset: -1
    number-depth: 3
    include-in-header:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", () => {
          document
            .querySelectorAll('a[href*="Notebooks/solutions/"]')
            .forEach(link => {
              link.target = "_blank";
              link.rel = "noopener noreferrer";
            });
        });
        </script>
    code-links:
      - text: Course Files
        icon: download
        href: https://github.com/PyEngSci/ProgPy
        target: _blank

